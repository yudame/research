<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <style>
        body {
            background: #ffffff;
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            color: #24292f;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: #24292f;
            color: #ffffff;
            border-color: #24292f;
        }
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Stablecoin Series</a>
        <article class="markdown-body" id="content">
            Loading...
        </article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Try XMLHttpRequest for better local file support
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'report.md', true);
        xhr.onload = function() {
            if (xhr.status === 200 || xhr.status === 0) { // 0 for local files
                document.getElementById('content').innerHTML = marked.parse(xhr.responseText);
            } else {
                document.getElementById('content').innerHTML =
                    '<p>Error loading report (status: ' + xhr.status + ')</p>';
            }
        };
        xhr.onerror = function() {
            document.getElementById('content').innerHTML =
                '<p>Error loading report. If viewing locally, try opening via: <code>python3 -m http.server 8000</code> and navigate to <code>http://localhost:8000</code></p>';
        };
        xhr.send();
    </script>
</body>
</html>
